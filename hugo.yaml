baseURL: 'https://example.org/'
languageCode: 'en-us'
title: 'Pato Diaz'
theme: 'papermod'

enableGitInfo: true
enableRobotsTXT: true
enableInlineShortcodes: true
enableEmoji: true
# pygmentsUseClasses: true
# pygmentsCodeFences: true

services:
  googleAnalytics:
    id: G-XVV3SNH9TH
  disqus:
    shortname: patricios-blog

menu:
  main:
    - name: Blog
      url: blog/
    - name: Projects
      url: projects/
    - name: Search
      url: search/
    - name: Resume
      url: resume/
    - name: CRAP
      url: crap-ranking/

params:
  defaultTheme: auto
  comments: true
  env: production
  author: Pato Diaz

  ShowShareButtons: true
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowAllPagesInArchive: true
  ShowCodeCopyButtons: true
  ShowToc: true
  displayFullLangName: true
  # canonifyURL: true
  # relativeURLs: true
  # baseURL: "https://padiazg.github.io/"

  profileMode:
    enabled: true
    title: "Pato Diaz"
    subtitle: "Senior Software Engineer · Go · Open Source · Cloud"
    imageUrl: "profile.jpg"
    imageTitle: "Pato Diaz"
    imageWidth: 320
    imageHeight: 320
    buttons:
      - name: Blog
        url: "/blog"
      - name: Projects
        url: "/projects"
      - name: GitHub
        url: "https://github.com/padiazg"

  socialIcons:
    - name: twitter
      url: "https://twitter.com/padiazg"
    - name: github
      url: "https://github.com/padiazg"
    - name: linkedin
      url: "https://www.linkedin.com/in/patricio-diaz-g/"

  mainSections:
    - blog
#   #   - articles

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    # limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]

  math: true

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
        enable: true
    renderer:
      unsafe: true  # Allows HTML in markdown files

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search